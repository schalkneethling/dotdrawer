# Builds and tests every pull request and every push to main, so a branch
# can't merge with a broken build, and so the release workflow's toolchain
# gets exercised long before a tag depends on it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # The package needs Swift 6.4, which first shipped with Xcode 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      # The same script releases use, signed ad hoc. It catches problems in
      # the bundling and signing steps that `swift build` alone would miss.
      - name: Build app bundle
        run: |
          ./scripts/build-app.sh
          codesign --verify --strict --deep --verbose=2 build/app.noindex/dotdrawer.app
