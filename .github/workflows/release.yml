# Publishes a release when a version tag is pushed, for example v0.2.0:
# builds the app, signs it with the Developer ID, notarizes it, generates
# Sparkle's appcast, and attaches both files to a GitHub release. When the
# HOMEBREW_TAP_TOKEN secret exists, it also points the Homebrew cask at the
# new version.
#
# README › Releasing lists the secrets this needs and how to create them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Two tags pushed close together must not race to publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The package needs Swift 6.4, which first shipped with Xcode 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag that disagrees with Info.plist would publish a zip and an
      # appcast entry under the wrong version.
      - name: Check the tag matches Info.plist
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Resources/Info.plist"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # A throwaway keychain that only this job uses, deleted in the last
      # step. codesign is allowed to use the key without a password prompt.
      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          echo "::add-mask::$keychain_password"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          umask 077
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          rm "$RUNNER_TEMP/developer-id.p12"

          # Put it first in the search list, so release.sh finds the identity.
          # list-keychains prints each existing keychain quoted and indented.
          search_list=("$keychain")
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            search_list+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"

      - name: Build, sign, notarize, and generate the appcast
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY }}
          DOTDRAWER_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          DOTDRAWER_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          export DOTDRAWER_NOTARY_KEY_FILE="$RUNNER_TEMP/notary-key.p8"
          export DOTDRAWER_SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle-key"
          printf '%s' "$NOTARY_KEY" > "$DOTDRAWER_NOTARY_KEY_FILE"
          printf '%s' "$SPARKLE_KEY" > "$DOTDRAWER_SPARKLE_KEY_FILE"
          trap 'rm -f "$DOTDRAWER_NOTARY_KEY_FILE" "$DOTDRAWER_SPARKLE_KEY_FILE"' EXIT
          ./scripts/release.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/release/$VERSION/dotdrawer-$VERSION.zip" \
            "build/release/$VERSION/appcast.xml" \
            --title "dotdrawer $VERSION" \
            --generate-notes \
            --verify-tag

      # Optional: needs a token that can push to the tap repository.
      - name: Update the Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: ./scripts/update-cask.sh "$VERSION"

      - name: Delete the keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN"
